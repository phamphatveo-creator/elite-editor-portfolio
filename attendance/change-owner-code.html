<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#b91c1c" />
<title>TRỘN MEDIA · Đổi mã Owner</title>
<style>
:root{--red:#b91c1c;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--bg:#f6f6f4}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:460px;margin:8vh auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.04)}.mark{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:900}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--red);margin-top:18px}.h1{font-size:30px;font-weight:950;letter-spacing:-.04em;margin:8px 0}.p{font-size:13px;color:var(--muted);line-height:1.55}.label{font-size:12px;font-weight:850;margin:18px 0 7px}.input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:none}.input:focus{border-color:#f87171;box-shadow:0 0 0 4px #fee2e2}.btn{width:100%;height:46px;border:0;border-radius:12px;margin-top:12px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{margin-top:12px;padding:11px 13px;border-radius:11px;background:#fef2f2;color:#b91c1c;font-size:12px;font-weight:750}.msg.ok{background:#f0fdf4;color:#166534}.back{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:12px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="wrap"><section class="card"><div class="mark">T</div><div class="eyebrow">OWNER SECURITY</div><div class="h1">Đổi mã Admin.</div><div class="p">Trang này chỉ hoạt động khi anh đã đăng nhập Owner trên Admin cùng thiết bị.</div><div class="label">Mã Owner mới</div><input id="newCode" class="input" type="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự" /><button id="saveBtn" class="btn">Đổi mã Owner</button><div id="msg"></div><a class="back" href="admin.html">← Quay lại Admin</a></section></main>
<script>
const API='https://xqzdumcxmgsnnehktudo.supabase.co';
const KEY='sb_publishable_pztHmtC_KrqMtIUrkf5Z_g_Bjj97pPr';
const SK='tron-owner-session-v1',DK='tron-owner-device-v1';
const $=id=>document.getElementById(id);
function saved(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}}
function deviceId(){return localStorage.getItem(DK)||''}
async function rpc(name,args){const r=await fetch(API+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw new Error(t||'server_error')}if(!r.ok)throw new Error(x?.message||x?.error||'server_error');return x}
function show(text,ok=false){$('msg').innerHTML='<div class="msg '+(ok?'ok':'')+'">'+text+'</div>'}
$('saveBtn').onclick=async()=>{const s=saved(),d=deviceId(),c=$('newCode').value.trim();if(!s?.token||!d){show('Chưa có phiên Owner. Mở Admin và đăng nhập trước.');return}if(c.length<8){show('Mã mới cần tối thiểu 8 ký tự.');return}$('saveBtn').disabled=true;try{const r=await rpc('admin_change_owner_code',{p_token:s.token,p_device_id:d,p_new_code:c});if(!r.ok)throw new Error(r.error);show('Đã đổi mã Owner thành công. Các phiên Admin khác đã bị đăng xuất.',true);$('newCode').value=''}catch(e){show(String(e).includes('invalid_session')?'Phiên Owner hết hạn. Đăng nhập Admin lại rồi thử.':'Không đổi được mã. Vui lòng thử lại.')}finally{$('saveBtn').disabled=false}}
</script>
</body></html>
