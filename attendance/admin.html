<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRỘN MEDIA · Admin</title></head><body style="margin:0;font-family:system-ui;background:#f5f6f7"><div id="boot" style="max-width:520px;margin:15vh auto;padding:24px;text-align:center;color:#6b7280">Đang mở Admin Trộn Media…</div><script>
(async()=>{
const BASE='https://raw.githubusercontent.com/phamphatveo-creator/elite-editor-portfolio/ff9e0487f5ee37af935e1a7791fb4a6881057c7c/attendance/admin.html';
const css=`
/* report isolated v3 */
.report-shell{display:grid;gap:12px}.report-main{padding:20px}.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.report-title{font-size:25px;font-weight:950;letter-spacing:-.04em}.report-badge{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:999px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;font-size:11px;font-weight:950}.report-filters{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:18px}.report-field{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fafafa}.report-scope{margin-top:12px;padding:15px 16px;border-radius:16px;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.report-scope-name{font-size:17px;font-weight:950}.report-scope .meta{color:#d1d5db}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;font-weight:850;color:#52525b;background:#f3f4f6;border-radius:999px;padding:6px 9px}.chip.good{background:#ecfdf5;color:#166534}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:190px}.report-card.primary{background:linear-gradient(145deg,#fff,#fff7f7);border-color:#fecaca}.report-icon{width:43px;height:43px;border-radius:13px;background:#f3f4f6;display:grid;place-items:center;font-weight:950;font-size:18px}.report-card.primary .report-icon{background:#fee2e2;color:#b91c1c}.report-card h3{margin:13px 0 0;font-size:17px}.report-card .desc{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 16px;flex:1}.report-card .btn{width:100%}.report-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.panel{display:none!important}.panel.active{display:block!important}@media(max-width:650px){.report-filters,.report-grid{grid-template-columns:1fr}.report-main{padding:15px}.report-foot .btn{width:100%}}

const patch=`
(function(){
const reportHTML='<div class="report-shell">'+
'<div class="card report-main"><div class="report-head"><div><div class="eyebrow">MONTHLY ATTENDANCE</div><div class="report-title">Báo công</div><div class="p" style="margin-top:5px">Chọn tháng và phạm vi cần xuất. Có thể lấy toàn team hoặc riêng từng nhân viên.</div></div><span id="reportScopeBadge" class="report-badge">Toàn team</span></div>'+
'<div class="report-filters"><div class="report-field"><div class="label">Tháng báo công</div><input id="reportMonth" class="input" type="month"/></div><div class="report-field"><div class="label">Nhân viên</div><select id="reportEmployee" class="select"><option value="">Tất cả nhân viên</option></select></div></div>'+
'<div class="report-scope"><div><div id="reportScopeTitle" class="report-scope-name">Xuất toàn bộ team</div><div id="reportScopeMeta" class="meta">Tất cả nhân viên trong tháng đã chọn</div></div><div class="chips"><span class="chip good">CSV UTF-8</span><span class="chip">Không lẫn nhân viên</span><span class="chip">Có nghỉ duyệt</span></div></div></div>'+
'<div class="report-grid"><div class="report-card primary"><div class="report-icon">Σ</div><h3>Bảng tổng hợp</h3><div class="desc">Ngày đi làm, nghỉ được duyệt, vắng, số lần trễ, thiếu Check Out và tổng giờ làm.</div><button id="downloadSummary" class="btn">Tải CSV tổng hợp</button></div><div class="report-card"><div class="report-icon">≡</div><h3>Bảng chi tiết</h3><div class="desc">Từng ngày, ca làm, giờ Check In/Out, phút trễ, giờ thực tế và lý do nghỉ.</div><button id="downloadDetail" class="btn secondary">Tải CSV chi tiết</button></div></div>'+
'<div class="card report-foot"><div><div class="section-title">Google Sheet lưu trữ</div><div class="p">Mở bảng lưu hiện có khi cần đối chiếu hoặc xử lý thêm.</div></div><button id="openSheet" class="btn dark">Mở Google Sheet</button></div><div id="reportMsg"></div></div>';
function reportSlug(v){return String(v||'team').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/đ/gi,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'team'}
function reportEmployees(){try{return (overviewData?.employees||[]).filter(e=>e.active&&String(e.role_title||'').toLowerCase()!=='owner test')}catch{return []}}
function updateReportScope(){const id=document.getElementById('reportEmployee')?.value||'',e=reportEmployees().find(x=>x.id===id);const b=document.getElementById('reportScopeBadge'),t=document.getElementById('reportScopeTitle'),m=document.getElementById('reportScopeMeta');if(b)b.textContent=e?e.name:'Toàn team';if(t)t.textContent=e?'Xuất riêng · '+e.name:'Xuất toàn bộ team';if(m)m.textContent=e?e.role_title+' · file chỉ chứa dữ liệu của nhân viên này':'Tất cả nhân viên trong tháng đã chọn'}
function fillReportEmployees(){const el=document.getElementById('reportEmployee');if(!el)return;const keep=el.value,es=reportEmployees();el.innerHTML='<option value="">Tất cả nhân viên</option>'+es.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' · '+esc(e.role_title)+'</option>').join('');if(keep&&es.some(e=>e.id===keep))el.value=keep;updateReportScope()}
async function exportOne(type){const rm=document.getElementById('reportMonth'),re=document.getElementById('reportEmployee'),out=document.getElementById('reportMsg'),m=rm?.value||'',id=re?.value||'',e=reportEmployees().find(x=>x.id===id);msg(out,'');if(!m){msg(out,'Chọn tháng cần xuất.');return}const b=type==='summary'?document.getElementById('downloadSummary'):document.getElementById('downloadDetail');b.disabled=true;try{const c=await exportConfig();let url=API+'/functions/v1/attendance-export?direct=1&type='+encodeURIComponent(type)+'&month='+encodeURIComponent(m)+'&token='+encodeURIComponent(c.export_token);if(id)url+='&employee_id='+encodeURIComponent(id);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tron-attendance-'+(e?reportSlug(e.name):'team')+'-'+type+'-'+m+'.csv';document.body.appendChild(a);a.click();const href=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);msg(out,'Đã tạo '+(type==='summary'?'bảng tổng hợp':'bảng chi tiết')+(e?' riêng cho '+e.name:' toàn team')+'.',true)}catch(ex){msg(out,err(ex))}finally{b.disabled=false}}
function mountReport(){const panel=document.getElementById('panel-reports');if(!panel)return;panel.innerHTML=reportHTML;const rm=document.getElementById('reportMonth');if(rm)rm.value=document.getElementById('dataMonth')?.value||new Date().toISOString().slice(0,7);fillReportEmployees();document.getElementById('reportEmployee').onchange=updateReportScope;document.getElementById('downloadSummary').onclick=()=>exportOne('summary');document.getElementById('downloadDetail').onclick=()=>exportOne('detail');document.getElementById('openSheet').onclick=async()=>{try{const c=await exportConfig();window.open(c.sheet_url,'_blank','noopener')}catch(ex){msg(document.getElementById('reportMsg'),err(ex))}}}
mountReport();
setTimeout(fillReportEmployees,700);
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{if(tab.dataset.tab==='reports'){setTimeout(()=>{const rm=document.getElementById('reportMonth');if(rm&&!rm.value)rm.value=document.getElementById('dataMonth')?.value||'';fillReportEmployees()},0)}}));
})();

try{
 let html=await (await fetch(BASE,{cache:'no-store'})).text();
 if(!html.includes('panel-reports')||!html.includes('panel-employees')||!html.includes('panel-schedules'))throw new Error('base_mismatch');
 html=html.replace('</style>',css+'</style>');
 html=html.replace('</body>','<script>'+patch.replace(/<\\/script>/gi,'<\\/script>')+'<\\/script></body>');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').innerHTML='<b style="color:#b91c1c">Không tải được Admin.</b><br>Vui lòng reload lại trang.';console.error(e)}
