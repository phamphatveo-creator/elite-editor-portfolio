<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRỘN MEDIA · Admin</title></head><body style="margin:0;font-family:system-ui;background:#f5f6f7"><div id="boot" style="max-width:520px;margin:15vh auto;padding:24px;text-align:center;color:#6b7280">Đang mở Admin Trộn Media…</div><script>
(async()=>{
const BASE='https://raw.githubusercontent.com/phamphatveo-creator/elite-editor-portfolio/ff9e0487f5ee37af935e1a7791fb4a6881057c7c/attendance/admin.html';
const css=`
/* report v4 + strict tab isolation */
.panel{display:none!important}.panel.active{display:block!important}.panel.stack{display:none!important}.panel.stack.active{display:grid!important}
.report-shell{display:grid;gap:12px}.report-main{padding:20px}.report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.report-title{font-size:25px;font-weight:950;letter-spacing:-.04em}.report-badge{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:999px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;font-size:11px;font-weight:950}.report-filters{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:18px}.report-field{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fafafa}.report-scope{margin-top:12px;padding:15px 16px;border-radius:16px;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.report-scope-name{font-size:17px;font-weight:950}.report-scope .meta{color:#d1d5db}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;font-weight:850;color:#52525b;background:#f3f4f6;border-radius:999px;padding:6px 9px}.chip.good{background:#ecfdf5;color:#166534}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:190px}.report-card.primary{background:linear-gradient(145deg,#fff,#fff7f7);border-color:#fecaca}.report-icon{width:43px;height:43px;border-radius:13px;background:#f3f4f6;display:grid;place-items:center;font-weight:950;font-size:18px}.report-card.primary .report-icon{background:#fee2e2;color:#b91c1c}.report-card h3{margin:13px 0 0;font-size:17px}.report-card .desc{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 16px;flex:1}.report-card .btn{width:100%}.report-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}@media(max-width:650px){.report-filters,.report-grid{grid-template-columns:1fr}.report-main{padding:15px}.report-foot .btn{width:100%}}
`;
const corrCss=`
.corr-list{display:grid;gap:10px}.corr-item{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff}.corr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.corr-name{font-size:16px;font-weight:950}.corr-lines{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.corr-line{padding:10px 11px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7;font-size:12px;line-height:1.5}.corr-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.corr-actions .btn{height:36px;padding:0 11px}.corr-reason{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:650px){.corr-lines{grid-template-columns:1fr}}
`;
const report=`<section id="panel-reports" class="panel"><div class="report-shell">
<div class="card report-main"><div class="report-head"><div><div class="eyebrow">MONTHLY ATTENDANCE</div><div class="report-title">Báo công</div><div class="p" style="margin-top:5px">Chọn tháng và phạm vi cần xuất. Có thể lấy toàn team hoặc riêng từng nhân viên.</div></div><span id="reportScopeBadge" class="report-badge">Toàn team</span></div>
<div class="report-filters"><div class="report-field"><div class="label">Tháng báo công</div><input id="reportMonth" class="input" type="month"/></div><div class="report-field"><div class="label">Nhân viên</div><select id="reportEmployee" class="select"><option value="">Tất cả nhân viên</option></select></div></div>
<div class="report-scope"><div><div id="reportScopeTitle" class="report-scope-name">Xuất toàn bộ team</div><div id="reportScopeMeta" class="meta">Tất cả nhân viên trong tháng đã chọn</div></div><div class="chips"><span class="chip good">CSV UTF-8</span><span class="chip">Không lẫn nhân viên</span><span class="chip">Có nghỉ duyệt</span></div></div></div>
<div class="report-grid"><div class="report-card primary"><div class="report-icon">Σ</div><h3>Bảng tổng hợp</h3><div class="desc">Ngày đi làm, nghỉ được duyệt, vắng, số lần trễ, thiếu Check Out và tổng giờ làm.</div><button id="downloadSummary" class="btn">Tải CSV tổng hợp</button></div><div class="report-card"><div class="report-icon">≡</div><h3>Bảng chi tiết</h3><div class="desc">Từng ngày, ca làm, giờ Check In/Out, phút trễ, giờ thực tế và lý do nghỉ.</div><button id="downloadDetail" class="btn secondary">Tải CSV chi tiết</button></div></div>
<div class="card report-foot"><div><div class="section-title">Google Sheet lưu trữ</div><div class="p">Mở bảng lưu hiện có khi anh cần đối chiếu hoặc xử lý thêm.</div></div><button id="openSheet" class="btn dark">Mở Google Sheet</button></div><div id="reportMsg"></div></div></section>`;
const funcs=`
function renderReportOptions(){const es=(overviewData?.employees||[]).filter(e=>e.active&&String(e.role_title||'').toLowerCase()!=='owner test'),el=$('reportEmployee'),keep=el?.value||'';if(!el)return;el.innerHTML='<option value="">Tất cả nhân viên</option>'+es.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' · '+esc(e.role_title)+'</option>').join('');if(keep&&es.some(e=>e.id===keep))el.value=keep;updateReportScope()}
function updateReportScope(){const id=$('reportEmployee')?.value||'',e=(overviewData?.employees||[]).find(x=>x.id===id);if($('reportScopeBadge'))$('reportScopeBadge').textContent=e?e.name:'Toàn team';if($('reportScopeTitle'))$('reportScopeTitle').textContent=e?'Xuất riêng · '+e.name:'Xuất toàn bộ team';if($('reportScopeMeta'))$('reportScopeMeta').textContent=e?e.role_title+' · file chỉ chứa dữ liệu của nhân viên này':'Tất cả nhân viên trong tháng đã chọn'}
function reportSlug(v){return String(v||'team').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/đ/gi,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'team'}
`;
const corrPanel=`<section id="panel-corrections" class="panel stack"><div class="card"><div class="section-head"><div><div class="section-title">Bổ sung chấm công</div><div class="p">So sánh giờ hệ thống với giờ nhân viên đề xuất. Dữ liệu gốc không bị sửa.</div></div><span id="correctionPendingCount" class="pill blue">0 chờ duyệt</span></div><div id="correctionList" class="corr-list" style="margin-top:13px"></div><div id="correctionMsg"></div></div></section>`;
const corrFuncs=`
function corrTypeLabel(t){return({check_in:'Quên Check In',check_out:'Quên Check Out',both:'Quên cả Check In & Out',full_day:'Xin tính đủ công',remote:'Remote / ngoài văn phòng'})[t]||t}
function corrTime(v){return v?String(v).slice(0,5):'—'}
function corrStatusPill(s){return s==='pending'?'<span class="pill blue">CHỜ DUYỆT</span>':s==='approved'?'<span class="pill green">ĐÃ DUYỆT</span>':'<span class="pill red">TỪ CHỐI</span>'}
function renderCorrections(){const rows=(overviewData?.correction_requests||[]).filter(c=>String(c.role_title||'').toLowerCase()!=='owner test'),pending=rows.filter(x=>x.status==='pending').length;if($('correctionPendingCount'))$('correctionPendingCount').textContent=pending+' chờ duyệt';if($('correctionTab'))$('correctionTab').textContent='Bổ sung công'+(pending?' ('+pending+')':'');if(!$('correctionList'))return;$('correctionList').innerHTML=rows.length?rows.map(c=>{const original='IN '+time(c.original_check_in_at)+' · OUT '+time(c.original_check_out_at),proposed=(c.request_type==='full_day'?'Xin tính đủ công':c.request_type==='remote'?'Remote':('IN '+corrTime(c.proposed_check_in_time)+' · OUT '+corrTime(c.proposed_check_out_time))),approved=c.status==='approved'?(c.resolution==='full_day'?'Đủ công đã duyệt':c.resolution==='remote'?'Remote đã duyệt':'Duyệt '+corrTime(c.approved_check_in_time)+' → '+corrTime(c.approved_check_out_time)):'';return '<div class="corr-item"><div class="corr-head"><div><div class="corr-name">'+esc(c.employee_name)+' · '+new Date(c.work_date+'T12:00:00').toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div><div class="meta">'+esc(c.role_title)+' · '+esc(corrTypeLabel(c.request_type))+'</div></div>'+corrStatusPill(c.status)+'</div><div class="corr-lines"><div class="corr-line"><b>Hệ thống gốc</b><br>'+original+'</div><div class="corr-line"><b>Nhân viên đề xuất</b><br>'+proposed+(approved?'<br><b>Kết quả:</b> '+approved:'')+'</div></div><div class="corr-reason"><b>Lý do:</b> '+esc(c.reason)+(c.admin_note?' · <b>Admin:</b> '+esc(c.admin_note):'')+'</div>'+(c.status==='pending'?'<div class="corr-actions">'+((c.request_type==='remote')?'<button class="btn approve small" onclick="reviewCorrectionSimple(&quot;'+c.id+'&quot;,&quot;remote&quot;)">Duyệt remote</button>':'<button class="btn approve small" onclick="approveCorrectionTimes(&quot;'+c.id+'&quot;)">Duyệt giờ</button><button class="btn secondary small" onclick="reviewCorrectionSimple(&quot;'+c.id+'&quot;,&quot;full_day&quot;)">Duyệt đủ công</button>')+'<button class="btn danger small" onclick="rejectCorrection(&quot;'+c.id+'&quot;)">Từ chối</button></div>':'')+'</div>'}).join(''):'<div class="empty">Tháng này chưa có yêu cầu bổ sung chấm công.</div>'}
async function callCorrectionReview(id,decision,resolution,cin,cout,note){msg($('correctionMsg'),'');try{const r=await rpc('admin_review_attendance_correction',{p_token:session.token,p_device_id:deviceId(),p_request_id:id,p_decision:decision,p_resolution:resolution||null,p_check_in_time:cin||null,p_check_out_time:cout||null,p_admin_note:note||null});if(!r.ok)throw new Error(r.error);msg($('correctionMsg'),decision==='approved'?'Đã duyệt bổ sung chấm công.':'Đã từ chối yêu cầu.',true);await load();if(calendarData)await loadCalendar()}catch(e){const x=String(e||'');msg($('correctionMsg'),x.includes('invalid_correction_time')?'Giờ duyệt chưa hợp lệ. Cần đủ Check In và Check Out, Check Out phải sau Check In.':err(e))}}
window.approveCorrectionTimes=async id=>{const c=(overviewData.correction_requests||[]).find(x=>x.id===id);if(!c)return;const din=c.proposed_check_in_time?corrTime(c.proposed_check_in_time):time(c.original_check_in_at),dout=c.proposed_check_out_time?corrTime(c.proposed_check_out_time):time(c.original_check_out_at);const cin=prompt('Giờ Check In được duyệt (HH:MM):',din==='—'?'':din);if(cin===null)return;const cout=prompt('Giờ Check Out được duyệt (HH:MM):',dout==='—'?'':dout);if(cout===null)return;const note=prompt('Ghi chú Admin (không bắt buộc):','')||'';if(!confirm('Duyệt '+cin+' → '+cout+' cho '+c.employee_name+'?'))return;await callCorrectionReview(id,'approved','apply_times',cin,cout,note)}
window.reviewCorrectionSimple=async(id,resolution)=>{const c=(overviewData.correction_requests||[]).find(x=>x.id===id);if(!c)return;const label=resolution==='remote'?'Remote đủ công':'đủ 1 công';if(!confirm('Duyệt '+label+' cho '+c.employee_name+' ngày '+dateLabel(c.work_date)+'?'))return;const note=prompt('Ghi chú Admin (không bắt buộc):','')||'';await callCorrectionReview(id,'approved',resolution,null,null,note)}
window.rejectCorrection=async id=>{const c=(overviewData.correction_requests||[]).find(x=>x.id===id);if(!c)return;const note=prompt('Lý do từ chối (không bắt buộc):','')||'';if(!confirm('Từ chối yêu cầu bổ sung của '+c.employee_name+'?'))return;await callCorrectionReview(id,'rejected',null,null,null,note)}
`;
const download=`async function downloadReport(type){msg($('reportMsg'),'');const m=$('reportMonth').value,id=$('reportEmployee')?.value||'',e=(overviewData?.employees||[]).find(x=>x.id===id);if(!m){msg($('reportMsg'),'Chọn tháng cần xuất.');return}const b=type==='summary'?$('downloadSummary'):$('downloadDetail');b.disabled=true;try{const c=await exportConfig();let url=API+'/functions/v1/attendance-export?direct=1&type='+encodeURIComponent(type)+'&month='+encodeURIComponent(m)+'&token='+encodeURIComponent(c.export_token);if(id)url+='&employee_id='+encodeURIComponent(id);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tron-attendance-'+(e?reportSlug(e.name):'team')+'-'+type+'-'+m+'.csv';document.body.appendChild(a);a.click();const href=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);msg($('reportMsg'),'Đã tạo '+(type==='summary'?'bảng tổng hợp':'bảng chi tiết')+(e?' riêng cho '+e.name:' toàn team')+'.',true)}catch(e){msg($('reportMsg'),err(e))}finally{b.disabled=false}}`;
try{
 let html=await (await fetch(BASE,{cache:'no-store'})).text();
 if(!html.includes('panel-reports')||!html.includes('async function downloadReport'))throw new Error('base_mismatch');
 html=html.replace('</style>',css+corrCss+'</style>');
 html=html.replace(/<section id="panel-reports"[\s\S]*?<\/section>\n<section id="panel-settings"/,report+'\n<section id="panel-settings"');
 html=html.replace('<button id="leaveTab" class="tab" data-tab="leave">Duyệt nghỉ</button><button class="tab" data-tab="reports">Báo công</button>','<button id="leaveTab" class="tab" data-tab="leave">Duyệt nghỉ</button><button id="correctionTab" class="tab" data-tab="corrections">Bổ sung công</button><button class="tab" data-tab="reports">Báo công</button>');
 html=html.replace('<section id="panel-reports"',corrPanel+'\n<section id="panel-reports"');
 html=html.replace("renderSettings();$('reportMonth')","renderSettings();renderCorrections();renderReportOptions();$('reportMonth')");
 html=html.replace('function renderSettings()',corrFuncs+'\nfunction renderSettings()');
 html=html.replace('async function exportConfig()',funcs+'\nasync function exportConfig()');
 html=html.replace(/async function downloadReport\(type\)\{[\s\S]*?\}async function openSheet/,download+'async function openSheet');
 html=html.replace("leave_pending:['Xin nghỉ','blue'],no_schedule", "leave_pending:['Xin nghỉ','blue'],correction_pending:['Bổ sung chờ duyệt','blue'],no_schedule");
 html=html.replace("['overview','calendar','employees','schedules','attendance','leave','reports','settings','security']", "['overview','calendar','employees','schedules','attendance','leave','corrections','reports','settings','security']");
 html=html.replace("$('downloadSummary').onclick","$('reportEmployee').onchange=updateReportScope;$('downloadSummary').onclick");
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').innerHTML='<b style="color:#b91c1c">Không tải được Admin.</b><br>Vui lòng reload lại trang.';console.error(e)}
})();
</script></body></html>
