<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRỘN MEDIA · Xuất báo công</title><style>body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f6f4;color:#18181b;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,460px);background:#fff;border:1px solid #e4e4e7;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.05)}.mark{width:36px;height:36px;border-radius:10px;background:#b91c1c;color:#fff;display:grid;place-items:center;font-weight:900}.h{font-size:22px;font-weight:900;margin:14px 0 6px}.p{font-size:13px;color:#71717a;line-height:1.55}.msg{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f4f4f5;font-size:12px;font-weight:700}.err{background:#fef2f2;color:#b91c1c}.ok{background:#f0fdf4;color:#166534}</style></head><body><div class="card"><div class="mark">T</div><div class="h">Đang tạo file báo công…</div><div class="p">Hệ thống đang dùng phiên Admin hiện tại để tạo file an toàn.</div><div id="msg" class="msg">Đang xác thực…</div></div><script>
const API='https://xqzdumcxmgsnnehktudo.supabase.co';
const KEY='sb_publishable_pztHmtC_KrqMtIUrkf5Z_g_Bjj97pPr';
const SK='tron-owner-session-v1',DK='tron-owner-device-v1';
const q=new URLSearchParams(location.search);const type=q.get('type')==='detail'?'detail':'summary';const month=/^\d{4}-\d{2}$/.test(q.get('month')||'')?q.get('month'):new Date().toISOString().slice(0,7);
function show(t,c=''){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+c}
function saved(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}}
function deviceId(){return localStorage.getItem(DK)||''}
async function rpc(name,args){const r=await fetch(API+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});const txt=await r.text();let x;try{x=JSON.parse(txt)}catch{throw new Error(txt||'server_error')}if(!r.ok)throw new Error(x?.message||x?.error||'server_error');return x}
(async()=>{try{const s=saved(),d=deviceId();if(!s?.token||!d)throw new Error('no_admin_session');show('Đang tạo quyền tải mới…');const c=await rpc('admin_export_config',{p_token:s.token,p_device_id:d});if(!c?.ok||!c.export_token)throw new Error(c?.error||'export_config_failed');show('Đang tải file…');const url=API+'/functions/v1/attendance-export?type='+encodeURIComponent(type)+'&month='+encodeURIComponent(month)+'&token='+encodeURIComponent(c.export_token);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(await r.text()||'download_failed');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tron-attendance-'+type+'-'+month+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);show('Đã tạo file. Anh có thể quay lại trang Admin.','ok');setTimeout(()=>{try{window.close()}catch{}},1600)}catch(e){show(String(e).includes('no_admin_session')?'Phiên Admin không còn hợp lệ. Quay lại trang Admin và đăng nhập lại.':'Không xuất được file. Quay lại Admin và thử lại.','err')}})();
</script></body></html>
