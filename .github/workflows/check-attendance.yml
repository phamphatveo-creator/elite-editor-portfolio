name: Check Trộn Attendance
on:
  push:
    branches: [main]
    paths:
      - 'attendance/**'
      - '.github/workflows/check-attendance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          for file in ['attendance/index.html', 'attendance/admin.html']:
              text = pathlib.Path(file).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', text, re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No inline script found in {file}')
              for i, script in enumerate(scripts):
                  path = pathlib.Path(tempfile.gettempdir()) / f'{pathlib.Path(file).stem}-{i}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
              print(f'OK: {file}')
          PY
      - name: Check public files do not contain owner code or server secrets
        run: |
          ! grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|6BC7E6E73E416872DA231DF94F04CB7E' attendance/
          echo 'OK: no owner/server secret in public attendance files'
